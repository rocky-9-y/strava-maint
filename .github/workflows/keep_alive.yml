name: Keep App Awake

on:
  schedule:
    - cron: '0 */4 * * *' # 4時間ごとに実行（完全にスリープを防ぎます）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App (GET Request)
        # -sLにすることで、人間がブラウザで開いた時と同じアクセスを再現します
        run: curl -sL "https://strava-maint-kbeijkshzbc9bjh3denedf.streamlit.app/" > /dev/null