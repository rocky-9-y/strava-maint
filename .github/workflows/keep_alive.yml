name: Keep App Awake

on:
  schedule:
    - cron: '0 */4 * * *' # 4時間ごとに自動巡回（スリープを永久防止）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Selenium
        run: pip install selenium
        
      - name: Keep App Awake
        run: |
          cat << 'EOF' > keep_alive.py
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import time

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1920,1080')
          options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')

          print("ブラウザを起動してアプリにアクセスします...")
          driver = webdriver.Chrome(options=options)
          driver.get("https://strava-maint-kbeijkshzbc9bjh3denedf.streamlit.app/")
          
          # 1. スリープ画面ならボタンを押す
          try:
              wake_button = WebDriverWait(driver, 15).until(
                  EC.presence_of_element_located((By.CSS_SELECTOR, "button[data-testid^='wakeup-button']"))
              )
              print("💤 スリープ画面を検知！ボタンを押してアプリを起こします...")
              driver.execute_script("arguments[0].click();", wake_button)
              print("✅ ボタンを押しました。アプリの起動（15秒）を待ちます...")
              time.sleep(15) # サーバーが完全に立ち上がるのを待つ
          except Exception:
              print("💡 アプリはすでに起きているか、ボタンはありません。")

          # 2. メイン画面（自転車データ）が表示されるまで見届ける
          try:
              WebDriverWait(driver, 30).until(
                  EC.presence_of_element_located((By.CSS_SELECTOR, "[data-testid='stAppViewContainer']"))
              )
              print("🚲 アプリの完全起動を確認しました！")
              time.sleep(5)
          except Exception as e:
              print("⚠️ 起動確認タイムアウト:", e)
          
          print("🎉 すべての処理が正常に完了しました。")
          driver.quit()
          EOF
          python keep_alive.py